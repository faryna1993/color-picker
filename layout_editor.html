<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Макет напису</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 12px 78px; font: 15px system-ui, sans-serif;
         color: var(--tg-theme-text-color, #17232e); background: var(--tg-theme-bg-color, #fff); }
  h1 { margin: 0 0 4px; font-size: 18px; }
  p { margin: 0 0 10px; opacity: .75; font-size: 13px; }
  #canvas { position: relative; aspect-ratio: 1.75; overflow: hidden;
            border: 1px solid #a89778; border-radius: 12px; touch-action: none;
            background: #f1ede4; }
  .word { position: absolute; transform: translate(-50%, -50%); padding: 0;
          border: 1px dashed transparent; color: #26352e; background: transparent;
          min-height: 24px; min-width: 24px; touch-action: none; user-select: none; }
  .word canvas { display: block; pointer-events: none; }
  .word.selected { border-color: #2481cc; background: #2481cc18; }
  #selected { margin: 10px 0 8px; padding: 10px; border-radius: 12px;
              background: var(--tg-theme-secondary-bg-color, #f0f0f0); }
  #selected label { display: block; margin-bottom: 6px; font-size: 13px; opacity: .75; }
  .controls { display: flex; gap: 8px; align-items: center; }
  button, input { min-height: 40px; border: 0; border-radius: 9px; color: inherit;
                  background: var(--tg-theme-bg-color, #fff); font: inherit; }
  button { min-width: 42px; padding: 5px 12px; }
  input { width: 74px; padding: 5px 8px; text-align: center; }
  #fontname { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
              text-align: center; font-size: 13px; opacity: .8; }
  #wordlist { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .chip { min-height: 34px; padding: 4px 10px; border: 1px solid #aaa; border-radius: 18px;
          background: transparent; font-size: 13px; }
  .chip.active { border-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-color, #2481cc); }
  #samples { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; }
  #samples button { min-width: 90px; flex: 1; }
  .bar { position: fixed; right: 0; bottom: 0; left: 0; padding: 8px 12px;
         border-top: 1px solid #0002; background: var(--tg-theme-bg-color, #fff); }
  #done { display: block; width: 100%; max-width: 560px; margin: auto; padding: 11px;
          color: var(--tg-theme-button-text-color, #fff); background: var(--tg-theme-button-color, #2481cc); }
</style>
</head>
<body>
<h1>Макет напису</h1>
<p>Перетягніть слова на полотно. Торкніться слова, щоб змінити його шрифт.</p>
<div id="canvas" aria-label="Полотно макета"></div>
<div id="selected">
  <label id="which">Вибране слово</label>
  <div class="controls">
    <button id="prev" aria-label="Попередній шрифт">−</button>
    <input id="font" type="number" min="1" inputmode="numeric" aria-label="Номер шрифту">
    <button id="next" aria-label="Наступний шрифт">+</button>
    <span id="fontname"></span>
  </div>
  <div id="samples" aria-label="Зразки шрифтів"></div>
</div>
<div id="wordlist"></div>
<div class="bar"><button id="done" disabled>Зберегти макет</button></div>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  const params = new URLSearchParams(location.search);
  const words = (params.get("text") || "Напис").trim().split(/\s+/).filter(Boolean).slice(0, 12);
  const mode = (params.get("mode") || "inscription").replace(/[^a-z]/gi, "");
  const fonts = (params.get("fonts") || "1").split(",").map(Number).filter(n => Number.isInteger(n) && n > 0);
  const initialFont = Number(params.get("font")) || fonts[0];
  const saved = JSON.parse(params.get("layout") || "[]");
  const canvas = document.getElementById("canvas");
  const fontInput = document.getElementById("font");
  const nodes = [];
  const state = words.map((word, i) => ({
    word, font: saved[i]?.font_number ?? initialFont, x: saved[i]?.x ?? 50,
    y: saved[i]?.y ?? (i + 1) * 100 / (words.length + 1),
  }));
  let selected = 0;
  let activeDrag = null;
  const faceCache = new Map();
  const measure = document.createElement("canvas").getContext("2d");
  const done = document.getElementById("done");
  const status = document.getElementById("fontname");

  function loadFace(number) {
    if (!faceCache.has(number)) {
      const id = `${mode}-${number}`;
      const promise = (async () => {
        for (const ext of ["ttf", "otf"]) {
          try {
            const face = new FontFace(`Font${number}`, `url(fonts/${id}.${ext})`);
            document.fonts.add(await face.load());
            return true;
          } catch (_) { /* Try the other supported font format. */ }
        }
        return false;
      })();
      faceCache.set(number, promise);
    }
    return faceCache.get(number);
  }

  function choose(index) {
    selected = index;
    fontInput.value = state[index].font;
    document.getElementById("which").textContent = `«${state[index].word}» — шрифт`;
    document.querySelectorAll(".word").forEach((node, i) => node.classList.toggle("selected", i === index));
    document.querySelectorAll(".chip").forEach((node, i) => node.classList.toggle("active", i === index));
    showSamples();
  }

  function showSamples() {
    const list = document.getElementById("samples");
    list.replaceChildren();
    const index = fonts.indexOf(state[selected].font);
    const start = Math.max(0, Math.min(index - 1, fonts.length - 3));
    for (const number of fonts.slice(start, start + 3)) {
      const button = document.createElement("button");
      button.textContent = state[selected].word;
      button.title = button.ariaLabel = `Шрифт №${number}`;
      button.disabled = true;
      button.addEventListener("click", () => setFont(number));
      list.appendChild(button);
      loadFace(number).then(loaded => {
        button.disabled = !loaded;
        if (loaded) button.style.fontFamily = `Font${number}`;
      });
    }
  }

  let revision = 0;
  async function renderFonts() {
    const current = ++revision;
    done.disabled = true;
    const loaded = await Promise.all(state.map(item => loadFace(item.font)));
    if (current !== revision) return;
    const metrics = state.map((item, i) => {
      const family = loaded[i] ? `Font${item.font}` : "cursive";
      measure.font = `100px ${family}`;
      const bounds = measure.measureText(item.word);
      return { family, bounds };
    });
    const widths = metrics.map(({ bounds }) => bounds.actualBoundingBoxLeft + bounds.actualBoundingBoxRight);
    const scale = canvas.clientWidth / (1.25 * Math.max(1, ...widths));
    const pixelRatio = Math.min(2, window.devicePixelRatio || 1);
    nodes.forEach((node, i) => {
      const { family, bounds } = metrics[i];
      const drawing = node.firstChild;
      const width = Math.max(24, widths[i] * scale + 4);
      const height = Math.max(24, (bounds.actualBoundingBoxAscent + bounds.actualBoundingBoxDescent) * scale + 4);
      drawing.style.width = `${width}px`;
      drawing.style.height = `${height}px`;
      drawing.width = Math.ceil(width * pixelRatio);
      drawing.height = Math.ceil(height * pixelRatio);
      const context = drawing.getContext("2d");
      context.scale(pixelRatio, pixelRatio);
      context.font = `${100 * scale}px ${family}`;
      context.fillStyle = "#26352e";
      context.fillText(state[i].word,
        width / 2 + (bounds.actualBoundingBoxLeft - bounds.actualBoundingBoxRight) * scale / 2,
        height / 2 + (bounds.actualBoundingBoxAscent - bounds.actualBoundingBoxDescent) * scale / 2);
    });
    done.disabled = loaded.includes(false);
    status.textContent = done.disabled ? "Шрифт недоступний" : "";
  }

  words.forEach((word, i) => {
    const node = document.createElement("button");
    node.className = "word";
    node.ariaLabel = word;
    node.appendChild(document.createElement("canvas"));
    node.addEventListener("click", () => choose(i));
    node.style.left = `${state[i].x}%`; node.style.top = `${state[i].y}%`;
    node.addEventListener("pointerdown", (event) => {
      event.preventDefault(); choose(i);
      const rect = canvas.getBoundingClientRect();
      activeDrag = {
        id: event.pointerId,
        dx: (event.clientX - rect.left) / rect.width * 100 - state[i].x,
        dy: (event.clientY - rect.top) / rect.height * 100 - state[i].y,
      };
      node.setPointerCapture(event.pointerId);
    });
    node.addEventListener("pointermove", (event) => {
      if (!activeDrag || activeDrag.id !== event.pointerId) return;
      const rect = canvas.getBoundingClientRect();
      state[i].x = Math.max(0, Math.min(100, (event.clientX - rect.left) / rect.width * 100 - activeDrag.dx));
      state[i].y = Math.max(0, Math.min(100, (event.clientY - rect.top) / rect.height * 100 - activeDrag.dy));
      node.style.left = `${state[i].x}%`; node.style.top = `${state[i].y}%`;
    });
    node.addEventListener("lostpointercapture", () => { activeDrag = null; });
    canvas.appendChild(node); nodes.push(node);
    const chip = document.createElement("button");
    chip.className = "chip"; chip.textContent = word; chip.addEventListener("click", () => choose(i));
    document.getElementById("wordlist").appendChild(chip);
  });

  function setFont(value) {
    const number = Number(value);
    if (fonts.includes(number)) state[selected].font = number;
    choose(selected);
    renderFonts();
  }
  function stepFont(step) {
    const index = fonts.indexOf(state[selected].font);
    setFont(fonts[Math.max(0, Math.min(fonts.length - 1, index + step))]);
  }
  fontInput.max = String(fonts.at(-1));
  fontInput.addEventListener("change", () => setFont(fontInput.value));
  document.getElementById("prev").addEventListener("click", () => stepFont(-1));
  document.getElementById("next").addEventListener("click", () => stepFont(1));
  done.addEventListener("click", () => tg.sendData(JSON.stringify({
    session: params.get("session"),
    words: state.map(({ font, x, y }) => ({ font, x: +x.toFixed(2), y: +y.toFixed(2) })),
  })));
  choose(0);
  renderFonts();
  window.addEventListener("resize", renderFonts);
</script>
</body>
</html>
