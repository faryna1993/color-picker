<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Кольори надпису</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; padding-bottom: 60px;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  .wrap { padding: 8px 14px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  #preview { background: #b7b2a8; border-radius: 12px; padding: 26px 10px; margin-bottom: 8px;
             display: flex; flex-direction: column; align-items: center; gap: 10px;
             min-height: 130px; justify-content: center; overflow: hidden; }
  .word { display: block; position: relative; line-height: 1; white-space: nowrap; cursor: default; }
  .word canvas { display: block; }
  .each .word { cursor: pointer; }
  .word.sel { outline: 2px dashed rgba(255,255,255,.95); outline-offset: 8px; border-radius: 4px; }
  .seg { display: flex; gap: 8px; margin-bottom: 10px; }
  .seg button, .tab { flex: 1; padding: 10px 6px; border-radius: 10px; border: 2px solid transparent; font-size: 14px;
         background: var(--tg-theme-secondary-bg-color, #eee); color: inherit; }
  .seg button.on, .tab.on { border-color: var(--tg-theme-button-color, #2481cc); }
  .check { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin: 0; accent-color: var(--tg-theme-button-color, #2481cc); }
  .tabs { display: flex; gap: 8px; margin-bottom: 6px; }
  .tab { font-size: 14px; padding: 5px 6px; }
  .tab:disabled, .sw:disabled { opacity: .35; }
  .tab .dot { display: inline-block; width: 14px; height: 14px; border-radius: 50%; vertical-align: -2px;
              margin-right: 6px; border: 1px solid rgba(0,0,0,.35);
              background: repeating-conic-gradient(#ccc 0 25%, #fff 0 50%) 0 0/8px 8px; }
  .tab .ok { color: #2e9e4f; margin-left: 4px; }
  .card { background: var(--tg-theme-secondary-bg-color, #f1f1f1); border-radius: 14px; padding: 8px; margin-bottom: 8px; }
  .area { display: flex; gap: 10px; height: 150px; }
  #sv { position: relative; flex: 1; border-radius: 10px; touch-action: none; cursor: crosshair;
        background: linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, rgba(255,255,255,0)), hsl(var(--hue, 0), 100%, 50%); }
  #hue { position: relative; width: 26px; border-radius: 10px; touch-action: none; cursor: pointer;
         background: linear-gradient(to bottom, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
  .thumb { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%;
           border: 3px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.4), 0 2px 6px rgba(0,0,0,.4); pointer-events: none; }
  #huethumb { left: 50%; }
  .hexrow { display: flex; gap: 8px; align-items: center; margin: 8px 0 6px; }
  #chip { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(0,0,0,.25); flex: none; }
  input[type=text] { flex: 1; min-width: 0; font-size: 15px; padding: 5px 10px; border-radius: 8px;
                     border: 1px solid rgba(0,0,0,.25); text-transform: uppercase; font-family: ui-monospace, monospace;
                     background: var(--tg-theme-bg-color, #fff); color: inherit; }
  .swatches { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px 4px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(0,0,0,.25); padding: 0; }
  .sw.on { box-shadow: 0 0 0 2px var(--tg-theme-bg-color, #fff), 0 0 0 4px var(--tg-theme-button-color, #2481cc); }
  .offset { background: var(--tg-theme-secondary-bg-color, #eee); border-radius: 10px; padding: 6px 12px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .offset input { flex: 1; min-width: 0; margin: 0; }
  .offset + .offset { margin-top: -2px; }
  .offset b { min-width: 64px; text-align: right; font-size: 14px; }
  input[type=range] { width: 100%; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 14px 8px;
         background: var(--tg-theme-bg-color, #fff); border-top: 1px solid rgba(0,0,0,.1); }
  #done { display: block; width: 100%; max-width: 560px; margin: 0 auto; padding: 9px; font-size: 16px;
          border: none; border-radius: 10px; background: var(--tg-theme-button-color, #2481cc);
          color: var(--tg-theme-button-text-color, #fff); }
  #done:disabled { opacity: .45; }
  #missing { text-align: center; font-size: 11px; opacity: .75; margin-bottom: 4px; }
  #missing:empty { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Кольори надпису</h1>
  <div id="preview"></div>

  <div class="offset">
    <span>Зміщення фону</span>
    <input type="range" id="offset" min="0" max="4" step="0.1" value="2">
    <b id="offval">не обрано</b>
  </div>
  <div class="offset">
    <span>Товщина шрифту</span>
    <input type="range" id="weight" min="0" max="1.5" step="0.1" value="0">
    <b id="wval">стандарт</b>
  </div>

  <label class="check" id="modes" hidden>
    <input type="checkbox" id="all-chk" checked>
    <span>Усі слова разом</span>
  </label>
  <div class="tabs">
    <button class="tab on" id="tab-text" data-t="text"><span class="dot"></span>Колір надпису<span class="ok"></span></button>
    <button class="tab" id="tab-bg" data-t="bg"><span class="dot"></span>Колір фону<span class="ok"></span></button>
  </div>
  <div class="card">
    <div class="area">
      <div id="sv"><div class="thumb" id="svthumb"></div></div>
      <div id="hue"><div class="thumb" id="huethumb"></div></div>
    </div>
    <div class="hexrow">
      <span id="chip"></span>
      <input type="text" id="hex" maxlength="7" placeholder="#RRGGBB" autocomplete="off" spellcheck="false">
    </div>
    <div class="swatches" id="swatches"></div>
  </div>
</div>
<div class="bar">
  <div id="missing"></div>
  <button id="done" disabled>Передати далі</button>
</div>
<script src="picker_layout.js?v=2"></script>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const PALETTE = ["#e53935","#fb8c00","#fdd835","#43a047","#1e88e5",
                   "#9cc9ee","#8e24aa","#f4a6b7","#d81b78","#795548",
                   "#ffffff","#111111","#9e9e9e","#c0c0c0","#d4af37",
                   "#b71c1c","#ff7043","#fff59d","#1b5e20","#00acc1",
                   "#0d47a1","#4a148c","#ec407a","#4e342e","#546e7a",
                   "#ffcc80","#a5d6a7","#80deea","#ce93d8","#424242",
                   "#ff8a80","#ffd54f","#aed581","#4db6ac","#64b5f6","#7986cb"];
  const valid = (v) => /^#[0-9a-fA-F]{6}$/.test(v || "");
  const params = new URLSearchParams(location.search);
  const words = (params.get("text") || "Abc").split(/\s+/).filter(Boolean).slice(0, 12);
  const fontId = (params.get("font") || "").replace(/[^a-z0-9-]/gi, "");


  // styles param: "ink-bg-offset" per word, "_" for words not configured yet
  const given = (params.get("styles") || "").split(",");
  const styles = words.map((_, i) => {
    const [ink, bg, off, wt] = (given[i] || "").split("-");
    const weight = isNaN(parseFloat(wt)) ? 0 : parseFloat(wt);
    return valid("#" + ink) && valid("#" + bg)
      ? { text: "#" + ink, bg: "#" + bg, offset: isNaN(parseFloat(off)) ? 2 : parseFloat(off), offsetSet: true, weight }
      : { text: "#e53935", bg: "#ffffff", offset: 2, offsetSet: true, weight: 0 };
  });
  const state =  { target: "text", sel: words.map((_, i) => i) };
  const isAll = () => state.sel.length === words.length;

  const preview = document.getElementById("preview");
  let picker = createPickerLayout(params, words, fontId, preview);
  picker.load().then(render);
  const withLayout = mountPickerEditor(params, preview, () => {
    picker = createPickerLayout(params, words, fontId, preview);
    picker.load().then(render);
  });
  const sv = document.getElementById("sv");
  const hueBar = document.getElementById("hue");
  const hex = document.getElementById("hex");
  const slider = document.getElementById("offset");
  const wslider = document.getElementById("weight");
  const doneBtn = document.getElementById("done");

  const nodes = words.map((w, i) => {
    const el = document.createElement("div");
    el.className = "word";
    const canvas = document.createElement("canvas");
    canvas.setAttribute("aria-label", w);
    el.appendChild(canvas);
    el.addEventListener("click", () => {
      if (words.length < 2) return;
      state.sel = [i];
      syncUi();
    });
    preview.appendChild(el);
    return el;
  });

  const targets = () => state.sel;
  const current = () => styles[targets()[0]];
  const fmt = (n) => n.toFixed(1).replace(".", ",") + "%";

  function squaredDistanceTransform(alpha, width, height) {
    const count = width * height;
    const infinity = 1e20;
    const vertical = new Float32Array(count);
    const distances = new Float32Array(count);
    const input = new Float64Array(Math.max(width, height));
    const output = new Float64Array(Math.max(width, height));
    const vertices = new Int32Array(Math.max(width, height));
    const boundaries = new Float64Array(Math.max(width, height) + 1);

    function transform1d(length) {
      let first = 0;
      while (first < length && input[first] >= infinity / 2) first++;
      if (first === length) {
        output.fill(infinity, 0, length);
        return;
      }
      let k = 0;
      vertices[0] = first;
      boundaries[0] = -Infinity;
      boundaries[1] = Infinity;
      for (let q = first + 1; q < length; q++) {
        if (input[q] >= infinity / 2) continue;
        let crossing;
        do {
          const v = vertices[k];
          crossing = ((input[q] + q * q) - (input[v] + v * v)) / (2 * (q - v));
          if (crossing <= boundaries[k]) k--;
          else break;
        } while (k >= 0);
        if (k < 0) {
          k = 0;
          vertices[0] = q;
          boundaries[0] = -Infinity;
          boundaries[1] = Infinity;
        } else {
          k++;
          vertices[k] = q;
          boundaries[k] = crossing;
          boundaries[k + 1] = Infinity;
        }
      }
      k = 0;
      for (let q = 0; q < length; q++) {
        while (boundaries[k + 1] < q) k++;
        const delta = q - vertices[k];
        output[q] = delta * delta + input[vertices[k]];
      }
    }

    for (let x = 0; x < width; x++) {
      for (let y = 0; y < height; y++) {
        input[y] = alpha[y * width + x] ? 0 : infinity;
      }
      transform1d(height);
      for (let y = 0; y < height; y++) vertical[y * width + x] = output[y];
    }
    for (let y = 0; y < height; y++) {
      const row = y * width;
      for (let x = 0; x < width; x++) input[x] = vertical[row + x];
      transform1d(width);
      for (let x = 0; x < width; x++) distances[row + x] = output[x];
    }
    return distances;
  }

  function dilateAlpha(sourceAlpha, distances, radius) {
    const result = new Uint8ClampedArray(distances.length);
    if (radius <= 0) return result;
    const edge = radius + 0.5;
    const edgeSquared = edge * edge;
    for (let i = 0; i < distances.length; i++) {
      const distanceSquared = distances[i];
      if (distanceSquared < edgeSquared) {
        const expanded = Math.round(Math.min(1, edge - Math.sqrt(distanceSquared)) * 255);
        result[i] = Math.max(sourceAlpha[i], expanded);
      }
    }
    return result;
  }

  // Vector path: glyph outlines (non-zero fill, so overlapping letters merge) are offset
  // with round joins, the equivalent of the shapely buffer used by dxf_generator.py.
  const CLIP_SCALE = 16;

  function glyphPolygons(commands, dx, dy, k) {
    const paths = [];
    let cur = null;
    let px = 0, py = 0;
    const add = (x, y) => { cur.push({ X: Math.round((x + dx) * k * CLIP_SCALE), Y: Math.round((y + dy) * k * CLIP_SCALE) }); px = x; py = y; };
    for (const c of commands) {
      if (c.type === "M") { cur = []; paths.push(cur); add(c.x, c.y); }
      else if (c.type === "L") add(c.x, c.y);
      else if (c.type === "Q") {
        const x0 = px, y0 = py;
        for (let t = 1; t <= 12; t++) {
          const u = t / 12, v = 1 - u;
          add(v * v * x0 + 2 * v * u * c.x1 + u * u * c.x, v * v * y0 + 2 * v * u * c.y1 + u * u * c.y);
        }
      } else if (c.type === "C") {
        const x0 = px, y0 = py;
        for (let t = 1; t <= 16; t++) {
          const u = t / 16, v = 1 - u;
          add(v * v * v * x0 + 3 * v * v * u * c.x1 + 3 * v * u * u * c.x2 + u * u * u * c.x,
              v * v * v * y0 + 3 * v * v * u * c.y1 + 3 * v * u * u * c.y2 + u * u * u * c.y);
        }
      }
    }
    return paths.filter((p) => p.length >= 3);
  }

  function unionNonZero(paths) {
    const clipper = new ClipperLib.Clipper();
    clipper.AddPaths(paths, ClipperLib.PolyType.ptSubject, true);
    const solution = new ClipperLib.Paths();
    clipper.Execute(ClipperLib.ClipType.ctUnion, solution, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
    return solution;
  }

  function roundOffset(paths, radius, k) {
    const offsetter = new ClipperLib.ClipperOffset(2, 0.1 * CLIP_SCALE);
    offsetter.AddPaths(paths, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
    const solution = new ClipperLib.Paths();
    offsetter.Execute(solution, radius * k * CLIP_SCALE);
    return solution;
  }

  function fillPaths(ctx, paths, color) {
    const region = new Path2D();
    for (const path of paths) {
      path.forEach((p, i) => (i ? region.lineTo(p.X / CLIP_SCALE, p.Y / CLIP_SCALE) : region.moveTo(p.X / CLIP_SCALE, p.Y / CLIP_SCALE)));
      region.closePath();
    }
    ctx.fillStyle = color;
    ctx.fill(region, "nonzero");
  }

  const canVector = () => window.ClipperLib && words.every((_, i) => picker.vector(i));

  function renderVector(sizeFor, longestInk, naturalWidth) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const size = sizeFor;
    nodes.forEach((n, i) => {
      const s = {
        ink: styles[i].text || "#e8e8e8",
        bg: styles[i].bg && styles[i].offset > 0 ? styles[i].bg : null,
        off: styles[i].offset, wt: styles[i].weight,
      };
      const longestPx = longestInk * size / 100;
      const weightRadius = s.wt / 100 * longestPx;
      const baseRadius = s.bg ? (s.off + s.wt) / 100 * longestPx : 0;
      const pad = Math.max(baseRadius, weightRadius) + 2;
      const path = picker.vector(i).getPath(words[i], 0, 0, size * picker.scales[i]);
      const box = path.getBoundingBox();
      const cssWidth = box.x2 - box.x1 + pad * 2;
      const cssHeight = box.y2 - box.y1 + pad * 2;
      const canvas = n.firstElementChild;
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.ceil(cssWidth * dpr);
      canvas.height = Math.ceil(cssHeight * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const text = unionNonZero(glyphPolygons(path.commands, pad - box.x1, pad - box.y1, dpr));
      if (s.bg) fillPaths(ctx, roundOffset(text, baseRadius, dpr), s.bg);
      fillPaths(ctx, weightRadius > 0 ? roundOffset(text, weightRadius, dpr) : text, s.ink);
      n.classList.toggle("sel", words.length > 1 && !isAll() && state.sel.includes(i));
    });
    picker.arrange(nodes, naturalWidth);
    preview.classList.toggle("each", words.length > 1);
  }

  function colorizeOffsets(baseAlpha, inkAlpha, baseColor, inkColor, width, height) {
    const result = new Uint8ClampedArray(width * height * 4);
    const color = (hex) => hex === "transparent"
      ? [0, 0, 0]
      : [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
    const [br, bg, bb] = color(baseColor);
    const [ir, ig, ib] = color(inkColor);
    for (let i = 0; i < baseAlpha.length; i++) {
      const aInk = inkAlpha[i] / 255;
      const aBase = baseAlpha[i] / 255;
      const outAlpha = aInk + aBase * (1 - aInk);
      const pixel = i * 4;
      if (!outAlpha) continue;
      result[pixel] = Math.round((ir * aInk + br * aBase * (1 - aInk)) / outAlpha);
      result[pixel + 1] = Math.round((ig * aInk + bg * aBase * (1 - aInk)) / outAlpha);
      result[pixel + 2] = Math.round((ib * aInk + bb * aBase * (1 - aInk)) / outAlpha);
      result[pixel + 3] = Math.round(outAlpha * 255);
    }
    return result;
  }

  function render() {
    const available = preview.clientWidth - 64;
    const measure = document.createElement("canvas").getContext("2d");
    const widths = words.map((word, i) => {
      measure.font = `${picker.hasFont(i) ? 400 : 700} 100px ${picker.family(i)}`;
      return measure.measureText(word).width;
    });
    const view = (i) => ({
      ink: styles[i].text || "#e8e8e8",
      bg: styles[i].bg && styles[i].offset > 0 ? styles[i].bg : "transparent",
      off: styles[i].offset, wt: styles[i].weight,
    });
    const vector = canVector();
    let inkWidths = widths;
    if (vector) {
      inkWidths = words.map((word, i) => {
        const b = picker.vector(i).getPath(word, 0, 0, 100).getBoundingBox();
        return b.x2 - b.x1;
      });
    }
    const reference = Math.max(...inkWidths.map((width, i) => width * picker.scales[i]));
    let size = 100;
    for (let k = 0; k < 3; k++) {
      const need = Math.max(...nodes.map((_, i) => (inkWidths[i] * picker.scales[i] + 2 * ((view(i).off + view(i).wt) / 100) * reference) * size / 100));
      size = Math.min(size * available / need, 110);
    }
    const naturalWidth = Math.max(...inkWidths) * size / 100;
    if (vector) { renderVector(size, reference, naturalWidth); return; }
    const longestPx = reference * size / 100;
    nodes.forEach((n, i) => {
      const s = view(i);
      const weightRadius = s.wt / 100 * longestPx;
      const baseRadius = s.off > 0 ? (s.off + s.wt) / 100 * longestPx : 0;
      const pad = Math.max(baseRadius, weightRadius) + 2;
      const wordSize = size * picker.scales[i];
      const textWidth = widths[i] * wordSize / 100;
      const height = wordSize * 1.2 + pad * 2;
      const cssWidth = textWidth + pad * 2;
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const canvas = n.firstElementChild;
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${height}px`;
      const pixelWidth = Math.ceil(cssWidth * dpr);
      const pixelHeight = Math.ceil(height * dpr);
      canvas.width = pixelWidth;
      canvas.height = pixelHeight;
      const mask = document.createElement("canvas");
      mask.width = pixelWidth;
      mask.height = pixelHeight;
      const maskCtx = mask.getContext("2d");
      maskCtx.scale(dpr, dpr);
      maskCtx.font = `${picker.hasFont(i) ? 400 : 700} ${wordSize}px ${picker.family(i)}`;
      maskCtx.textBaseline = "alphabetic";
      const x = pad;
      const y = pad + wordSize * 0.88;
      maskCtx.fillStyle = "#fff";
      maskCtx.fillText(words[i], x, y);
      const maskData = maskCtx.getImageData(0, 0, pixelWidth, pixelHeight).data;
      const sourceAlpha = new Uint8Array(pixelWidth * pixelHeight);
      for (let p = 0; p < sourceAlpha.length; p++) sourceAlpha[p] = maskData[p * 4 + 3];
      const distances = squaredDistanceTransform(sourceAlpha, pixelWidth, pixelHeight);
      const baseAlpha = s.off > 0
        ? dilateAlpha(sourceAlpha, distances, baseRadius * dpr)
        : new Uint8ClampedArray(sourceAlpha.length);
      const inkAlpha = weightRadius > 0
        ? dilateAlpha(sourceAlpha, distances, weightRadius * dpr)
        : sourceAlpha;
      const result = colorizeOffsets(baseAlpha, inkAlpha, s.bg, s.ink, pixelWidth, pixelHeight);
      const ctx = canvas.getContext("2d");
      ctx.putImageData(new ImageData(result, pixelWidth, pixelHeight), 0, 0);
      n.classList.toggle("sel", words.length > 1 && !isAll() && state.sel.includes(i));
    });
    picker.arrange(nodes, naturalWidth);
    preview.classList.toggle("each", words.length > 1);
  }

  function syncUi() {
    const cur = current();
    // without an offset there is no backing, so its colour is not needed
    const hasBase = cur.offset > 0;
    if (!hasBase && state.target === "bg") state.target = "text";
    document.getElementById("tab-bg").disabled = !hasBase;
    const color = state.target === "text" ? cur.text : cur.bg;
    if (color) {
      hex.value = color.toUpperCase();
      if (hsvToHex(hsv) !== color) Object.assign(hsv, hexToHsv(color));
      document.getElementById("chip").style.background = color;
    }
    sv.style.setProperty("--hue", hsv.h);
    document.getElementById("svthumb").style.cssText = "left:" + hsv.s * 100 + "%;top:" + (1 - hsv.v) * 100 + "%";
    document.getElementById("huethumb").style.top = hsv.h / 360 * 100 + "%";
    document.querySelectorAll(".sw").forEach((b) => b.classList.toggle("on", b.dataset.c === color));
    document.querySelectorAll(".tab").forEach((b) => b.classList.toggle("on", b.dataset.t === state.target));
    for (const t of ["text", "bg"]) {
      const tab = document.getElementById("tab-" + t);
      tab.querySelector(".dot").style.background = cur[t] || "";
      tab.querySelector(".ok").textContent = cur[t] ? "✓" : "";
    }
    slider.value = cur.offset;
    document.getElementById("offval").textContent = cur.offset > 0 ? fmt(cur.offset) : "без фону";
    wslider.value = cur.weight;
    document.getElementById("wval").textContent = cur.weight > 0 ? fmt(cur.weight) : "стандарт";
    document.getElementById("all-chk").checked = isAll();

    const missing = [];
    styles.forEach((s, i) => {
      const parts = [];
      if (!s.text) parts.push("колір надпису");
      if (!s.bg && s.offset > 0) parts.push("колір фону");
      if (!s.offsetSet) parts.push("зміщення");
      if (parts.length) missing.push(words.length > 1 ? "«" + words[i] + "»: " + parts.join(", ") : parts.join(", "));
    });
    doneBtn.disabled = missing.length > 0;
    document.getElementById("missing").textContent = missing.length ? "Ще оберіть — " + missing.join("; ") : "";
    render();
  }

  function patch(values) {
    targets().forEach((i) => Object.assign(styles[i], values));
  }
  function setColor(c) {
    patch({ [state.target]: c.toLowerCase() });
    if (state.target === "text" && !current().bg && current().offset > 0) state.target = "bg";
    syncUi();
  }

  const hsv = { h: 0, s: 1, v: 1 };
  function hexToHsv(c) {
    const r = parseInt(c.slice(1, 3), 16) / 255, g = parseInt(c.slice(3, 5), 16) / 255, b = parseInt(c.slice(5, 7), 16) / 255;
    const max = Math.max(r, g, b), d = max - Math.min(r, g, b);
    let h = 0;
    if (d) h = max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return { h: Math.round(h * 60), s: max ? d / max : 0, v: max };
  }
  function hsvToHex({ h, s, v }) {
    const f = (n) => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
    return "#" + [f(5), f(3), f(1)].map((x) => Math.round(x * 255).toString(16).padStart(2, "0")).join("");
  }
  const drag = (el, onMove) => {
    const handle = (e) => {
      const r = el.getBoundingClientRect();
      onMove(Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height)));
    };
    el.addEventListener("pointerdown", (e) => { el.setPointerCapture(e.pointerId); handle(e); });
    el.addEventListener("pointermove", (e) => { if (el.hasPointerCapture(e.pointerId)) handle(e); });
  };
  drag(sv, (x, y) => { hsv.s = x; hsv.v = 1 - y; setColor(hsvToHex(hsv)); });
  drag(hueBar, (x, y) => { hsv.h = Math.round(y * 360) % 360; setColor(hsvToHex(hsv)); });

  const sw = document.getElementById("swatches");
  PALETTE.forEach((c) => {
    const b = document.createElement("button");
    b.className = "sw"; b.dataset.c = c; b.style.background = c;
    b.addEventListener("click", () => setColor(c));
    sw.appendChild(b);
  });
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { state.target = b.dataset.t; syncUi(); }));
  hex.addEventListener("input", () => {
    const v = hex.value.startsWith("#") ? hex.value : "#" + hex.value;
    if (valid(v)) setColor(v);
  });
  slider.addEventListener("input", () => { patch({ offset: parseFloat(slider.value), offsetSet: true }); syncUi(); });
  wslider.addEventListener("input", () => { patch({ weight: parseFloat(wslider.value) }); syncUi(); });

  if (words.length > 1) {
    document.getElementById("modes").hidden = false;
    document.getElementById("all-chk").addEventListener("change", (e) => {
      if (e.target.checked) {
        // all words take the style of the one being edited
        const base = { ...styles[state.sel[0]] };
        styles.forEach((s) => Object.assign(s, base));
        state.sel = words.map((_, i) => i);
      } else {
        state.sel = [0];
      }
      syncUi();
    });
  }

  doneBtn.addEventListener("click", () => {
    if (doneBtn.disabled) return;
    tg.sendData(JSON.stringify(withLayout({ styles: styles.map((s) => ({
      text_color: s.text, bg_color: s.bg || "#ffffff", offset: Math.round(s.offset * 10) / 10, weight: Math.round(s.weight * 10) / 10 })) })));
  });
  window.addEventListener("resize", render);

  syncUi();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
</body>
</html>
