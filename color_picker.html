<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Вибір кольору</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; padding: 16px; font-family: system-ui, sans-serif;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  h1 { font-size: 18px; margin: 0 0 12px; }
  #preview { display: flex; align-items: center; justify-content: center; height: 150px;
             border-radius: 12px; background: #b7b2a8; margin-bottom: 16px; overflow: hidden; }
  #sample { font-size: 64px; font-weight: 700; line-height: 1; padding: 0 20px;
            -webkit-text-stroke: 14px var(--base); paint-order: stroke fill; }
  .row { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
  input[type=color] { width: 96px; height: 64px; border: none; padding: 0; background: none; }
  input[type=text] { flex: 1; min-width: 0; font-size: 20px; padding: 10px; border-radius: 8px;
                     border: 1px solid #999; text-transform: uppercase; }
  button { width: 100%; padding: 14px; font-size: 18px; border: none; border-radius: 10px;
           background: var(--tg-theme-button-color, #2481cc);
           color: var(--tg-theme-button-text-color, #fff); }
</style>
</head>
<body>
<h1 id="title">Оберіть колір</h1>
<div id="preview"><span id="sample">Abc</span></div>
<div class="row">
  <input type="color" id="picker" value="#ff69b4">
  <input type="text" id="hex" maxlength="7" value="#FF69B4">
</div>
<button id="done">Готово</button>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();
  const params = new URLSearchParams(location.search);
  const target = params.get("target") === "bg" ? "bg" : "text";
  const valid = (value) => /^#[0-9a-fA-F]{6}$/.test(value);
  const fromParam = (name, fallback) => valid("#" + (params.get(name) || "")) ? "#" + params.get(name) : fallback;
  const textColor = fromParam("text", "#1e88e5");
  const baseColor = fromParam("bg", "#ffffff");
  const sample = document.getElementById("sample");
  const picker = document.getElementById("picker");
  const hex = document.getElementById("hex");
  const initial = target === "bg" ? baseColor : textColor;

  document.getElementById("title").textContent =
    (target === "bg" ? "Колір фону" : "Колір надпису") + (params.get("word") ? " — «" + params.get("word") + "»" : "");
  sample.textContent = (params.get("word") || "Abc").slice(0, 8);

  function apply(color) {
    picker.value = color;
    hex.value = color.toUpperCase();
    sample.style.color = target === "text" ? color : textColor;
    sample.style.setProperty("--base", target === "bg" ? color : baseColor);
  }
  picker.addEventListener("input", () => apply(picker.value));
  hex.addEventListener("input", () => {
    const value = hex.value.startsWith("#") ? hex.value : "#" + hex.value;
    if (valid(value)) apply(value.toLowerCase());
  });
  document.getElementById("done").addEventListener("click", () => {
    if (valid(picker.value)) tg.sendData(picker.value);
  });
  apply(initial);
</script>
</body>
</html>
