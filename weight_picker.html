<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>&#1058;&#1086;&#1074;&#1097;&#1080;&#1085;&#1072; &#1096;&#1088;&#1080;&#1092;&#1090;&#1091;</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/clipper-lib@6.4.2/clipper.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; padding-bottom: 60px;
         background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #111); }
  .wrap { padding: 8px 14px; max-width: 560px; margin: 0 auto; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  #preview { background: #b7b2a8; border-radius: 12px; padding: 26px 10px; margin-bottom: 8px;
             display: flex; flex-direction: column; align-items: center; gap: 10px;
             min-height: 130px; justify-content: center; overflow: hidden; }
  .word canvas { display: block; }
  .offset { background: var(--tg-theme-secondary-bg-color, #eee); border-radius: 10px; padding: 10px 12px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .offset input { flex: 1; min-width: 0; margin: 0; }
  .offset b { min-width: 64px; text-align: right; font-size: 14px; }
  .option { background: var(--tg-theme-secondary-bg-color, #eee); border-radius: 10px; padding: 10px 12px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .option input { width: 20px; height: 20px; margin: 0; accent-color: var(--tg-theme-button-color, #2481cc); }
  #connectStatus { margin: 2px 4px 10px; font-size: 17px; font-weight: 600; line-height: 1.4; }
  #connectStatus.disconnected { color: #e53935; }
  #connectHint { margin: 0 4px 10px; font-size: 17px; font-weight: 600; line-height: 1.4; opacity: .9; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 14px 8px;
         background: var(--tg-theme-bg-color, #fff); border-top: 1px solid rgba(0,0,0,.1); }
  #done { display: block; width: 100%; max-width: 560px; margin: 0 auto; padding: 9px; font-size: 16px;
          border: none; border-radius: 10px; background: var(--tg-theme-button-color, #2481cc);
          color: var(--tg-theme-button-text-color, #fff); }
  .offset, .option { background: color-mix(in srgb, var(--tg-theme-secondary-bg-color,#eee) 88%, #d99452); }
</style>
</head>
<body>
<div class="wrap">
  <h1>&#1058;&#1086;&#1074;&#1097;&#1080;&#1085;&#1072; &#1096;&#1088;&#1080;&#1092;&#1090;&#1091;</h1>
  <div id="preview"></div>
  <div class="offset">
    <span>&#1058;&#1086;&#1074;&#1097;&#1080;&#1085;&#1072;</span>
    <input type="range" id="weight" min="0" max="1.5" step="0.1" value="0">
    <b id="wval">&#1089;&#1090;&#1072;&#1085;&#1076;&#1072;&#1088;&#1090;</b>
  </div>
  <label class="option">
    <input type="checkbox" id="connectAll">
    <span>&#1047;&#8217;&#1108;&#1076;&#1085;&#1072;&#1090;&#1080; &#1091;&#1089;&#1110; &#1077;&#1083;&#1077;&#1084;&#1077;&#1085;&#1090;&#1080; &#1088;&#1072;&#1079;&#1086;&#1084;</span>
  </label>
  <div id="connectStatus" aria-live="polite"></div>
  <div id="connectHint">&#1063;&#1077;&#1088;&#1074;&#1086;&#1085;&#1080;&#1084; &#1087;&#1086;&#1079;&#1085;&#1072;&#1095;&#1077;&#1085;&#1086; &#1077;&#1083;&#1077;&#1084;&#1077;&#1085;&#1090;&#1080;, &#1103;&#1082;&#1110; &#1084;&#1080; &#1079;&#8217;&#1108;&#1076;&#1085;&#1072;&#1108;&#1084;&#1086; &#1074;&#1088;&#1091;&#1095;&#1085;&#1091;, &#1097;&#1086;&#1073;&#1080; &#1085;&#1072;&#1087;&#1080;&#1089; &#1074;&#1080;&#1075;&#1083;&#1103;&#1076;&#1072;&#1074; &#1094;&#1110;&#1083;&#1110;&#1089;&#1085;&#1080;&#1084;.</div>
</div>
<div class="bar">
  <button id="done">&#1055;&#1077;&#1088;&#1077;&#1076;&#1072;&#1090;&#1080; &#1076;&#1072;&#1083;&#1110;</button>
</div>
<script src="picker_layout.js?v=4"></script>
<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const params = new URLSearchParams(location.search);
  const words = (params.get("text") || "Application started").split(/\s+/).filter(Boolean).slice(0, 12);
  const connectAll = document.getElementById("connectAll");
  connectAll.checked = params.get("connect_all") === "true";
  let connectRequested = connectAll.checked;
  const connectStatus = document.getElementById("connectStatus");
  const connectHint = document.getElementById("connectHint");
  function syncConnectStatus() {
    connectStatus.classList.toggle("disconnected", !connectAll.checked);
    connectStatus.innerHTML = connectAll.checked
      ? "&#1050;&#1088;&#1072;&#1087;&#1082;&#1080; &#1090;&#1072; &#1110;&#1085;&#1096;&#1110; &#1086;&#1082;&#1088;&#1077;&#1084;&#1110; &#1095;&#1072;&#1089;&#1090;&#1080;&#1085;&#1080; &#1073;&#1091;&#1076;&#1091;&#1090;&#1100; &#1079;&#8217;&#1108;&#1076;&#1085;&#1072;&#1085;&#1110; &#1090;&#1086;&#1085;&#1082;&#1080;&#1084;&#1080; &#1087;&#1077;&#1088;&#1077;&#1093;&#1086;&#1076;&#1072;&#1084;&#1080;."
      : "&#1054;&#1082;&#1088;&#1077;&#1084;&#1110; &#1077;&#1083;&#1077;&#1084;&#1077;&#1085;&#1090;&#1080; &#1079;&#1072;&#1083;&#1080;&#1096;&#1072;&#1090;&#1100;&#1089;&#1103; &#1085;&#1077;&#1079;&#8217;&#1108;&#1076;&#1085;&#1072;&#1085;&#1080;&#1084;&#1080;.";
  }
  connectAll.addEventListener("change", () => {
    connectRequested = connectAll.checked;
    syncConnectStatus();
    render();
  });
  syncConnectStatus();
  const fontId = (params.get("font") || "inscription-1").replace(/[^a-z0-9-]/gi, "");
  const parsed = parseFloat(params.get("weight"));
  let weight = isNaN(parsed) ? 0 : Math.min(1.5, Math.max(0, parsed));

  const preview = document.getElementById("preview");
  const slider = document.getElementById("weight");
  const fmt = (n) => n.toFixed(1).replace(".", ",") + "%";
  const nodes = words.map((w) => {
    const el = document.createElement("div");
    el.className = "word";
    const canvas = document.createElement("canvas");
    canvas.setAttribute("aria-label", w);
    el.appendChild(canvas);
    preview.appendChild(el);
    return canvas;
  });

  const CLIP_SCALE = 16;
  function glyphPolygons(commands, dx, dy, k) {
    const paths = [];
    let cur = null;
    let px = 0, py = 0;
    const add = (x, y) => { cur.push({ X: Math.round((x + dx) * k * CLIP_SCALE), Y: Math.round((y + dy) * k * CLIP_SCALE) }); px = x; py = y; };
    for (const c of commands) {
      if (c.type === "M") { cur = []; paths.push(cur); add(c.x, c.y); }
      else if (c.type === "L") add(c.x, c.y);
      else if (c.type === "Q") {
        const x0 = px, y0 = py;
        for (let t = 1; t <= 12; t++) {
          const u = t / 12, v = 1 - u;
          add(v * v * x0 + 2 * v * u * c.x1 + u * u * c.x, v * v * y0 + 2 * v * u * c.y1 + u * u * c.y);
        }
      } else if (c.type === "C") {
        const x0 = px, y0 = py;
        for (let t = 1; t <= 16; t++) {
          const u = t / 16, v = 1 - u;
          add(v * v * v * x0 + 3 * v * v * u * c.x1 + 3 * v * u * u * c.x2 + u * u * u * c.x,
              v * v * v * y0 + 3 * v * v * u * c.y1 + 3 * v * u * u * c.y2 + u * u * u * c.y);
        }
      }
    }
    return paths.filter((p) => p.length >= 3);
  }

  function unionNonZero(paths) {
    const clipper = new ClipperLib.Clipper();
    clipper.AddPaths(paths, ClipperLib.PolyType.ptSubject, true);
    const solution = new ClipperLib.Paths();
    clipper.Execute(ClipperLib.ClipType.ctUnion, solution, ClipperLib.PolyFillType.pftNonZero, ClipperLib.PolyFillType.pftNonZero);
    return solution;
  }

  function roundOffset(paths, radius, k) {
    const offsetter = new ClipperLib.ClipperOffset(2, 0.1 * CLIP_SCALE);
    offsetter.AddPaths(paths, ClipperLib.JoinType.jtRound, ClipperLib.EndType.etClosedPolygon);
    const solution = new ClipperLib.Paths();
    offsetter.Execute(solution, radius * k * CLIP_SCALE);
    return solution;
  }

  function fillPaths(ctx, paths, color) {
    const region = new Path2D();
    for (const path of paths) {
      path.forEach((p, i) => (i ? region.lineTo(p.X / CLIP_SCALE, p.Y / CLIP_SCALE) : region.moveTo(p.X / CLIP_SCALE, p.Y / CLIP_SCALE)));
      region.closePath();
    }
    ctx.fillStyle = color;
    ctx.fill(region, "nonzero");
  }

  function connectRasterComponents(ctx, canvas) {
    const width = canvas.width, height = canvas.height;
    const pixels = ctx.getImageData(0, 0, width, height).data;
    const labels = new Int32Array(width * height);
    const components = [];
    const neighbours = [-1, 1, -width, width, -width - 1, -width + 1, width - 1, width + 1];
    for (let start = 0; start < width * height; start++) {
      if (labels[start] || pixels[start * 4 + 3] === 0) continue;
      const id = components.length + 1;
      const points = [start];
      labels[start] = id;
      for (let cursor = 0; cursor < points.length; cursor++) {
        const pos = points[cursor], x = pos % width, y = (pos / width) | 0;
        for (const delta of neighbours) {
          const next = pos + delta;
          if (next < 0 || next >= width * height || labels[next] || pixels[next * 4 + 3] === 0) continue;
          const nx = next % width, ny = (next / width) | 0;
          if (Math.abs(nx - x) > 1 || Math.abs(ny - y) > 1) continue;
          labels[next] = id;
          points.push(next);
        }
      }
      components.push(points);
    }
    if (components.length < 2) return false;
    components.sort((a, b) => b.length - a.length);
    const getBounds = (points) => {
      let minY = height, maxY = -1;
      for (const point of points) {
        const y = (point / width) | 0;
        minY = Math.min(minY, y);
        maxY = Math.max(maxY, y);
      }
      return { minY, maxY };
    };
    const mainBounds = getBounds(components[0]);
    const topBandBottom = mainBounds.minY + (mainBounds.maxY - mainBounds.minY) * 0.55;
    const minMajorArea = Math.max(4, Math.floor(components[0].length * 0.01));
    const meaningful = [components[0], ...components.slice(1).filter((component) =>
      component.length >= minMajorArea
      || (component.length >= 4 && getBounds(component).maxY <= topBandBottom)
    )].slice(0, 17);
    if (meaningful.length < 2) return false;
    if (!connectAll.checked) return true;
    const boundary = (points) => points.filter((pos) => {
      const x = pos % width, y = (pos / width) | 0;
      return neighbours.some((delta) => {
        const next = pos + delta;
        return next < 0 || next >= width * height || labels[next] !== labels[pos]
          || Math.abs((next % width) - x) > 1 || Math.abs(((next / width) | 0) - y) > 1;
      });
    });
    const main = boundary(meaningful[0]);
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.strokeStyle = "#e53935";
    ctx.lineWidth = Math.max(2, (window.devicePixelRatio || 1) * 2);
    for (const component of meaningful.slice(1)) {
      let minX = width, minY = height, maxX = 0, maxY = 0;
      for (const pos of component) {
        const x = pos % width, y = (pos / width) | 0;
        minX = Math.min(minX, x); minY = Math.min(minY, y);
        maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
      }
      const pad = Math.max(2, (window.devicePixelRatio || 1) * 2);
      ctx.beginPath();
      ctx.ellipse((minX + maxX) / 2, (minY + maxY) / 2,
        Math.max(2, (maxX - minX) / 2) + pad,
        Math.max(2, (maxY - minY) / 2) + pad, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.strokeStyle = "#ffeb3b";
    ctx.lineWidth = Math.max(2, (window.devicePixelRatio || 1) * 1.5);
    ctx.lineCap = "round";
    for (const part of meaningful.slice(1).map(boundary)) {
      let bestDistance = Infinity, bestA = 0, bestB = 0;
      for (const a of part) {
        const ax = a % width, ay = (a / width) | 0;
        for (const b of main) {
          const dx = ax - (b % width), dy = ay - ((b / width) | 0);
          const distance = dx * dx + dy * dy;
          if (distance < bestDistance) { bestDistance = distance; bestA = a; bestB = b; }
        }
      }
      ctx.beginPath();
      ctx.moveTo(bestA % width, (bestA / width) | 0);
      ctx.lineTo(bestB % width, (bestB / width) | 0);
      ctx.stroke();
    }
    ctx.restore();
    return true;
  }

  let picker = createPickerLayout(params, words, fontId, preview);
  picker.load().then(render);
  const withLayout = mountPickerEditor(params, preview, words, () => {
    picker = createPickerLayout(params, words, fontId, preview);
    picker.load().then(render);
  });

  function render() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const available = preview.clientWidth - 64;
    if (!window.ClipperLib || !words.every((_, i) => picker.vector(i))) {
      const hasConnectable = renderFallback(dpr, available);
      updateConnectAvailability(hasConnectable);
      return;
    }
    const inkWidths = words.map((w, i) => {
      const b = picker.vector(i).getPath(w, 0, 0, 100).getBoundingBox();
      return b.x2 - b.x1;
    });
    const reference = Math.max(...inkWidths.map((width, i) => width * picker.scales[i]));
    let size = 100;
    for (let k = 0; k < 3; k++) {
      const need = reference * size / 100 * (1 + 2 * weight / 100);
      size = Math.min(size * available / need, 110);
    }
    const longestPx = reference * size / 100;
    const radius = weight / 100 * longestPx;
    const pad = radius + 2;
    let hasConnectable = false;
    nodes.forEach((canvas, i) => {
      const path = picker.vector(i).getPath(words[i], 0, 0, size * picker.scales[i]);
      const box = path.getBoundingBox();
      const cssWidth = box.x2 - box.x1 + pad * 2;
      const cssHeight = box.y2 - box.y1 + pad * 2;
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.ceil(cssWidth * dpr);
      canvas.height = Math.ceil(cssHeight * dpr);
      const ctx = canvas.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      const text = unionNonZero(glyphPolygons(path.commands, pad - box.x1, pad - box.y1, dpr));
      fillPaths(ctx, radius > 0 ? roundOffset(text, radius, dpr) : text, "#26352e");
      hasConnectable = connectRasterComponents(ctx, canvas) || hasConnectable;
    });
    picker.arrange(nodes.map(canvas => canvas.parentElement), Math.max(...inkWidths) * size / 100);
    updateConnectAvailability(hasConnectable);
  }

  function updateConnectAvailability(hasConnectable) {
    connectAll.disabled = !hasConnectable;
    connectAll.checked = connectRequested;
    connectHint.hidden = !hasConnectable || !connectAll.checked;
    connectStatus.hidden = !hasConnectable;
    syncConnectStatus();
  }

  // Used until the font file is loaded or when it is not published next to the page.
  function renderFallback(dpr, available) {
    const measure = document.createElement("canvas").getContext("2d");
    const widths = words.map((w, i) => {
      measure.font = `${picker.hasFont(i) ? 400 : 700} 100px ${picker.family(i)}`;
      return measure.measureText(w).width;
    });
    const longest = Math.max(...widths.map((width, i) => width * picker.scales[i]));
    const size = Math.min(110, 100 * available / (longest * (1 + 2 * weight / 100)));
    const radius = weight / 100 * longest * size / 100;
    let hasConnectable = false;
    nodes.forEach((canvas, i) => {
      const pad = radius + 2;
      const wordSize = size * picker.scales[i];
      const cssWidth = widths[i] * wordSize / 100 + pad * 2;
      const cssHeight = wordSize * 1.2 + pad * 2;
      canvas.style.width = `${cssWidth}px`;
      canvas.style.height = `${cssHeight}px`;
      canvas.width = Math.ceil(cssWidth * dpr);
      canvas.height = Math.ceil(cssHeight * dpr);
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      ctx.font = `${picker.hasFont(i) ? 400 : 700} ${wordSize}px ${picker.family(i)}`;
      ctx.fillStyle = ctx.strokeStyle = "#26352e";
      ctx.lineJoin = "round";
      ctx.lineWidth = radius * 2;
      const y = pad + wordSize * 0.88;
      if (radius > 0) ctx.strokeText(words[i], pad, y);
      ctx.fillText(words[i], pad, y);
      hasConnectable = connectRasterComponents(ctx, canvas) || hasConnectable;
    });
    picker.arrange(nodes.map(canvas => canvas.parentElement), Math.max(...widths) * size / 100);
    return hasConnectable;
  }

  function syncUi() {
    slider.value = weight;
    document.getElementById("wval").textContent = weight > 0 ? "+" + fmt(weight) : "\u0441\u0442\u0430\u043d\u0434\u0430\u0440\u0442";
    render();
  }

  slider.addEventListener("input", () => { weight = parseFloat(slider.value); syncUi(); });
  document.getElementById("done").addEventListener("click", () => {
    tg.sendData(JSON.stringify(withLayout({
      weight: Math.round(weight * 10) / 10,
      connect_all: connectAll.checked
    })));
  });
  window.addEventListener("resize", render);

  syncUi();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
</script>
</body>
